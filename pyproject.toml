[project]
name = "axion"
version = "0.1.0"
description = "World Language Model smoke training across a three-node subhalo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pyyaml",
  "rich",
  "sentencepiece",
  "datasets",
  "torch>=2.5",
  "mlflow>=3.14.0",
]

[project.optional-dependencies]
dev = ["pytest"]
export = [
  "safetensors>=0.4",
  "transformers>=4.57,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
