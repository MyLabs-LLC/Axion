model:
  vocab_size: 4096
  d_model: 128
  n_layers: 6
  n_heads: 4
  d_ff: 512
  seq_len: 512
  rope_theta: 10000
  tie_embeddings: false
train:
  micro_batch: 8
  n_microbatches: 16
  optimizer: adamw
  betas: [0.9, 0.95]
  lr: 3.0e-3
  min_lr: 3.0e-4
  warmup_steps: 100
  lr_schedule: cosine
  weight_decay: 0.1
  grad_clip: 1.0
  precision: bf16
  total_tokens: 100_000_000
  seed: 1337
  smoke_steps: 2
data:
  path: data/fineweb_edu_100M.bin
  synthetic_tokens: 2_000_000
