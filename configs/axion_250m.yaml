model:
  vocab_size: 16384
  d_model: 1024
  n_layers: 16
  n_heads: 16
  d_ff: 4096
  seq_len: 1024
  rope_theta: 10000
  tie_embeddings: false
train:
  micro_batch: 2
  n_microbatches: 4
  optimizer: adamw
  betas: [0.9, 0.95]
  lr: 3.0e-4
