model:
  vocab_size: 4096
  d_model: 2048
  n_layers: 24
  n_heads: 16
  d_ff: 8192
  seq_len: 512
  rope_theta: 10000
  tie_embeddings: false
train:
  micro_batch: 1
  n_microbatches: 2
  optimizer: adamw
  betas: [0.9, 0.95]
  lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 100
  lr_schedule: cosine
  weight_decay: 0.1
  grad_clip: 1.0
  precision: bf16
  total_tokens: 586_000_000
  seed: 1337
  smoke_steps: 1
data:
  path: data/fineweb_edu_586M.bin
  synthetic_tokens: 2_000_000
